<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>恐龙模拟器 · PK 版（iOS点击修复）</title>
<meta name="theme-color" content="#2A7DE1">
<style>
  :root{--bg1:#0b1220;--bg2:#0e1726;--text:#eaf2ff;--panel:rgba(255,255,255,.06)}
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:linear-gradient(180deg,var(--bg1),var(--bg2) 40%,var(--bg1));color:var(--text);
        font-family:system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial}
  .wrap{max-width:960px;margin:0 auto;padding:10px}
  .card{background:var(--panel);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:10px;margin-top:8px}
  #game{width:100%;aspect-ratio:16/9;background:#10223a;border-radius:12px;border:1px solid rgba(255,255,255,.12)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;
          padding:16px;z-index:9999;pointer-events:auto}
  .sheet{background:#121a2a;border:1px solid rgba(255,255,255,.1);border-radius:18px;max-width:760px;width:100%;padding:16px}
  .roles{display:grid;gap:10px}
  .role{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:14px;cursor:pointer}
  .role h3{margin:0 0 6px;font-size:16px}
  .small{opacity:.9;font-size:12px;line-height:1.4}
  .pill{display:inline-block;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
        border-radius:999px;padding:6px 10px;font-size:12px;margin-right:6px}
  button.btn{background:#163155;color:#eaf2ff;border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:10px 14px;font-size:14px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="pill">⏱ 生成时间：2025-10-18 10:28:02</div>
    <div class="pill">iOS 点击修复版</div>
    <div class="card">
      <canvas id="game" width="960" height="540"></canvas>
      <div style="margin-top:8px;font-size:13px;opacity:.85">提示：若声音未出，请先在画面任意处点一下再开始。</div>
      <div style="margin-top:8px"><button id="btnRestart" class="btn">🔁 重载（测试点击）</button></div>
    </div>
  </div>

  <!-- 角色选择弹窗 -->
  <div id="modal" class="modal" role="dialog" aria-modal="true">
    <div class="sheet">
      <h2 style="margin:0 0 10px">选择你的恐龙（iOS 点击修复）</h2>
      <div class="roles">
        <div class="role" tabindex="0" data-role="herb">
          <h3>① 三角龙（草食）</h3>
          <div class="small">生命高、冲刺短；技能：护盾顶撞（Z，短时减伤）</div>
        </div>
        <div class="role" tabindex="0" data-role="raptor">
          <h3>② 迅猛龙（肉食）</h3>
          <div class="small">移速快、攻击高；技能：连击（Z，短时双段打击）</div>
        </div>
        <div class="role" tabindex="0" data-role="anky">
          <h3>③ 甲龙（防御）</h3>
          <div class="small">防御高、回血快；技能：旋转尾锤（Z，小范围群攻）</div>
        </div>
      </div>
      <div class="small" style="margin-top:10px">（点任意卡片开始；已兼容 iOS 的 pointer/touch/click）</div>
    </div>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = canvas.width, H = canvas.height;
function drawBg(){ const g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#0f1d33'); g.addColorStop(1,'#0b1220'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); }
drawBg();

const modal = document.getElementById('modal');
function pickRole(r){
  modal.style.display='none';
  drawBg();
  ctx.fillStyle='#eaf2ff'; ctx.font='700 22px system-ui'; ctx.textAlign='center';
  ctx.fillText('开始啦！选择：'+r, W/2, H/2);
}
function onRoleTap(e){
  e.preventDefault(); e.stopPropagation();
  const card = e.target.closest('.role');
  if(!card) return;
  const r = card.getAttribute('data-role');
  pickRole(r);
}
modal.addEventListener('pointerdown', onRoleTap, {passive:false});
modal.addEventListener('touchstart', onRoleTap, {passive:false});
modal.addEventListener('click', onRoleTap, {passive:false});

// iOS 音频解锁（即便你暂时没用到音频，也提前解锁，避免 Safari 吞事件）
let audioUnlocked = false;
function unlockAudio(){
  if(audioUnlocked) return;
  try{ const A = window.AudioContext || window.webkitAudioContext; const ac = new A(); const o=ac.createOscillator(); const g=ac.createGain(); g.gain.value=0; o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+0.01); audioUnlocked=true; }catch(_){}
}
['touchstart','pointerdown','mousedown','keydown'].forEach(ev=>{
  window.addEventListener(ev, unlockAudio, {once:true, passive:false});
});

document.getElementById('btnRestart').addEventListener('click', ()=>location.reload());

function resize(){ const w = canvas.clientWidth; const h = Math.round(w*9/16); canvas.height = h; W=canvas.width; H=canvas.height; drawBg(); }
resize(); addEventListener('resize', resize);
</script>
</body>
</html>
